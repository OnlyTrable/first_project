<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nurtown Project</title>
    <link rel="stylesheet" href="assets/styles/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
          <img src="assets/images/logo.png" alt="Logo" />
        </div>
        <nav>
          <ul>
            <li><a href="#">Головна</a></li>
            <li><a href="#">Про нас</a></li>
            <li><a href="#">Проекти</a></li>
            <li><a href="#">Контакти</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <h1>PROJECT NURTOWN</h1>
          <img src="assets/images/hero-image.jpg" alt="Hero Image" />
        </div>
      </section>

      <section class="about">
        <div class="container">
          <h2>О компании</h2>
          <p>Текст про компанію...</p>
          <div class="images">
            <img src="assets/images/about-image1.jpg" alt="About Image 1" />
            <img src="assets/images/about-image2.jpg" alt="About Image 2" />
            <img src="assets/images/about-image3.jpg" alt="About Image 3" />
          </div>
        </div>
      </section>

      <section class="tasks">
        <div class="container">
          <h2>Основные задачи</h2>
          <ol>
            <li>Задача 1...</li>
            <li>Задача 2...</li>
          </ol>
        </div>
      </section>

      <section class="projects">
        <div class="container">
          <h2>Наши проекты</h2>
          <h3>ДОСУГОВЫЙ ЦЕНТР</h3>
          <div class="gallery">
            <img src="assets/images/project-image1.jpg" alt="Project Image 1" />
            <img src="assets/images/project-image2.jpg" alt="Project Image 2" />
            <img src="assets/images/project-image3.jpg" alt="Project Image 3" />
            <img src="assets/images/project-image4.jpg" alt="Project Image 4" />
          </div>
        </div>
      </section>

      <section class="contact">
        <div class="container">
          <h2>Связаться с нами</h2>
          <form>
            <input type="text" placeholder="Ваше ім'я" />
            <input type="email" placeholder="Ваш email" />
            <textarea placeholder="Ваше повідомлення"></textarea>
            <button type="submit">Надіслати</button>
          </form>
          <img src="assets/images/contact-image.jpg" alt="Contact Image" />
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <div class="logo">
          <img src="assets/images/logo.png" alt="Logo" />
        </div>
        <nav>
          <ul>
            <li><a href="#">Головна</a></li>
            <li><a href="#">Про нас</a></li>
            <li><a href="#">Проекти</a></li>
            <li><a href="#">Контакти</a></li>
          </ul>
        </nav>
        <div class="contact-info">
          <p>Адреса: ...</p>
          <p>Телефон: ...</p>
          <p>Email: ...</p>
        </div>
        <div class="social-icons">
          <a href="#"><img src="facebook.png" alt="Facebook" /></a>
          <a href="#"><img src="twitter.png" alt="Twitter" /></a>
          <a href="#"><img src="instagram.png" alt="Instagram" /></a>
        </div>
      </div>
    </footer>

    <script src="assets/scripts/index.js"></script>
  </body>
</html>
